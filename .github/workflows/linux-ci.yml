name: Linux CI
run-name: Linux CI / ${{ github.ref }}

on:
  push:
    branches: ['**']
    tags: ['npm/**', 'npm-next/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_PREVIEW_BRANCH: ${{ vars.NPM_PREVIEW_BRANCH }}

jobs:
  linux:
    if: >-
      github.event_name != 'push' ||
      (!github.event.deleted && (github.ref == 'refs/heads/main' ||
      (vars.NPM_PREVIEW_BRANCH != '' && github.ref == format('refs/heads/{0}', vars.NPM_PREVIEW_BRANCH)) ||
      startsWith(github.ref, 'refs/tags/npm/') || startsWith(github.ref, 'refs/tags/npm-next/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install native build and test dependencies
        run: |
          rustc --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libclang-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxkbcommon-dev xvfb xdotool imagemagick libvulkan1 mesa-vulkan-drivers

      - name: Select the software Vulkan driver
        run: |
          for driver in /usr/share/vulkan/icd.d/lvp_icd{,.x86_64}.json; do
            if [[ -f "$driver" ]]; then
              printf 'VK_DRIVER_FILES=%s\n' "$driver" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Mesa's Lavapipe Vulkan driver manifest was not found" >&2
          exit 1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Prepare package versions
        id: prepare
        run: bun scripts/release/ci.ts prepare

      - name: Lint
        run: bun run lint

      - name: Run core tests in Node and Bun
        run: bun run test

      - name: Build and verify npm tarballs
        run: bun scripts/release/ci.ts pack

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.prepare.outputs.publish == 'true'
        with:
          name: npm-release
          path: build/npm-release/
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: linux
    if: >-
      github.event_name == 'push' && !github.event.deleted &&
      needs.linux.outputs.publish == 'true' &&
      (startsWith(github.ref, 'refs/tags/npm/') || startsWith(github.ref, 'refs/tags/npm-next/') ||
      (vars.NPM_PREVIEW_BRANCH != '' && github.ref == format('refs/heads/{0}', vars.NPM_PREVIEW_BRANCH)))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-${{ startsWith(github.ref, 'refs/tags/npm/') && 'stable' || 'next' }}
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-release
          path: build/npm-release/

      - name: Publish tested tarballs to npm
        run: bun scripts/release/publish.ts
