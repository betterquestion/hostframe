name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install native build and test dependencies
        run: |
          rustup update stable --no-self-update
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxkbcommon-dev xvfb xdotool imagemagick libvulkan1 mesa-vulkan-drivers

      - name: Select the software Vulkan driver
        run: |
          for driver in /usr/share/vulkan/icd.d/lvp_icd{,.x86_64}.json; do
            if [[ -f "$driver" ]]; then
              printf 'VK_DRIVER_FILES=%s\n' "$driver" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Mesa's Lavapipe Vulkan driver manifest was not found" >&2
          exit 1

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run core tests in Node and Bun
        run: bun run test

      - name: Install and test the packed package in Node and Bun
        working-directory: packages/core
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          bun pm pack --filename "$consumer/hostframe.tgz"
          cp test/fixtures/packed-package.mjs "$consumer/"
          cd "$consumer"
          printf '%s\n' '{"name":"hostframe-package-smoke","private":true}' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund ./hostframe.tgz
          timeout 30s node packed-package.mjs
          timeout 30s bun packed-package.mjs
